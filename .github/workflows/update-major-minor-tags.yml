name: Update Major Minor Tags

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  update-major-minor-tags:
    name: Update major/minor tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Move major/minor tags
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # Prereleases must not advance the stable major and minor tags.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          minor="${tag%.*}"
          major="${minor%.*}"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -fa "$minor" -m "Release $tag" "$GITHUB_SHA"
          git tag -fa "$major" -m "Release $tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$minor" "refs/tags/$major"
